- name: Generate Keystore
  run: |
    mkdir -p app/keys

    keytool -genkeypair \
      -v \
      -keystore app/keys/selaura.jks \
      -alias launcher \
      -keyalg RSA \
      -keysize 2048 \
      -validity 10000 \
      -storepass MyStrongPass123 \
      -keypass MyStrongPass123 \
      -dname "CN=Selaura, OU=Android, O=GitHub, L=Dhaka, ST=Khulna, C=BD"
